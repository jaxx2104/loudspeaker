name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '.processed-stars.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (version pinned in mise.toml / mise.lock)
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bunx biome ci .

      - name: Type check
        run: bun run check

      - name: Test
        run: bun test
